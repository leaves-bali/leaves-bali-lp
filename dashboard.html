<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaves Bali | 顧客管理ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#A85E43; --green-dk:#7E4129; --green-pale:#FAF0EA; --green-mid:#EFD9CC;
  --white:#FFFFFF; --off:#FBFAF8; --cream:#F7F1EA; --stone:#EFE6DC;
  --ink:#23211F; --ink-m:#574C47; --ink-l:#8B7D76;
  --terra:#BE6B4C; --gold:#C79A55;
  --rose:#CC897F; --rose-dk:#AE655A; --rose-lt:#F3DCD3; --rose-pale:#FCF3EF;
  --blue:#C2A294; --blue-dk:#9C6B58; --blue-lt:#F4EAE3;
  --ok:#5C8A5A; --ok-lt:#E6F0E4; --warn:#C08A3E; --warn-lt:#FBF0DC; --danger:#C0554A; --danger-lt:#F8E4E0;
  --rule:rgba(168,94,67,0.14); --rule-2:rgba(35,33,31,0.08);
  --serif:'Shippori Mincho',serif; --sans:'Noto Sans JP',sans-serif; --disp:'Cormorant Garamond',serif;
  --sh:0 1px 2px rgba(35,33,31,.04),0 4px 20px rgba(126,65,41,.06);
  --sh-lg:0 8px 40px rgba(126,65,41,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--off);color:var(--ink);font-weight:400;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.7}
::selection{background:var(--green-mid)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
svg{width:1em;height:1em;flex:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--green-mid);border-radius:9px}

/* ---------- LAYOUT ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#2A211C 0%,#3A2A22 100%);color:#EBDDD4;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:14px}
.brand-logo{width:38px;height:38px;border-radius:9px;background:var(--rose);display:grid;place-items:center;font-family:var(--disp);font-size:22px;font-weight:600;color:#fff;flex:none}
.brand-t{font-family:var(--serif);font-size:14.5px;font-weight:700;letter-spacing:.06em;line-height:1.35}
.brand-t small{display:block;font-family:var(--sans);font-size:10px;font-weight:300;letter-spacing:.18em;color:#B79B8C;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:9px;color:#CBB6AA;font-size:13.5px;font-weight:500;letter-spacing:.02em;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--rose);color:#fff;box-shadow:0 4px 14px rgba(204,137,127,.35)}
.nav a svg{width:18px;height:18px;flex:none;stroke-width:1.7}
.side-foot{padding:12px 10px 4px;border-top:1px solid rgba(255,255,255,.09);margin-top:8px}
.conn{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#B79B8C}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.live{background:#7FC77C;box-shadow:0 0 0 3px rgba(127,199,124,.22)}
.dot.demo{background:var(--gold);box-shadow:0 0 0 3px rgba(199,154,85,.22)}
.side-foot button{margin-top:10px;width:100%;font-size:11.5px;color:#CBB6AA;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.14);transition:.15s}
.side-foot button:hover{background:rgba(255,255,255,.07);color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:rgba(251,250,248,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);padding:16px 34px;display:flex;align-items:center;gap:18px}
.topbar h1{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.03em}
.topbar .sub{font-size:12px;color:var(--ink-l);margin-top:1px}
.spacer{flex:1}
.search{position:relative}
.search input{width:230px;padding:9px 14px 9px 36px;border:1px solid var(--rule);border-radius:999px;background:var(--white);transition:.15s;outline:none}
.search input:focus{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-pale);width:280px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-l)}
.content{padding:28px 34px 60px;max-width:1360px;width:100%}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:9px;font-size:13px;font-weight:600;letter-spacing:.02em;transition:.15s;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke-width:2}
.btn.pri{background:var(--rose);color:#fff;box-shadow:0 3px 12px rgba(204,137,127,.3)}
.btn.pri:hover{background:var(--rose-dk)}
.btn.gho{background:var(--white);color:var(--ink-m);border:1px solid var(--rule)}
.btn.gho:hover{border-color:var(--rose);color:var(--rose-dk)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.dng{background:var(--danger-lt);color:var(--danger)}
.btn.dng:hover{background:var(--danger);color:#fff}

/* ---------- CARDS / KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:var(--white);border:1px solid var(--rule);border-radius:15px;padding:20px 20px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px}
.kpi .ic svg{width:20px;height:20px;stroke-width:1.8}
.kpi .lab{font-size:12px;color:var(--ink-l);letter-spacing:.04em;font-weight:500}
.kpi .val{font-family:var(--disp);font-size:34px;font-weight:600;line-height:1.05;margin-top:5px;letter-spacing:.01em}
.kpi .val small{font-family:var(--sans);font-size:14px;color:var(--ink-l);font-weight:500;margin-left:3px}
.kpi .meta{font-size:11.5px;color:var(--ink-l);margin-top:6px}
.kpi .meta b{color:var(--ok);font-weight:600}

.panel{background:var(--white);border:1px solid var(--rule);border-radius:15px;box-shadow:var(--sh);margin-bottom:22px}
.panel-h{display:flex;align-items:center;gap:12px;padding:17px 22px;border-bottom:1px solid var(--rule-2)}
.panel-h h2{font-family:var(--serif);font-size:15.5px;font-weight:700;letter-spacing:.03em}
.panel-h .spacer{flex:1}
.panel-b{padding:20px 22px}
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-l);text-transform:uppercase;padding:0 14px 11px;border-bottom:1px solid var(--rule-2);white-space:nowrap}
tbody td{padding:13px 14px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
tbody tr{transition:.12s;cursor:pointer}
tbody tr:hover{background:var(--green-pale)}
tbody tr:last-child td{border-bottom:none}
.cust-cell{display:flex;align-items:center;gap:11px}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:14px;color:#fff;flex:none}
.cust-name{font-weight:600;color:var(--ink)}
.cust-sub{font-size:11.5px;color:var(--ink-l)}

/* ---------- BADGES / CHIPS ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.chip .cd{width:6px;height:6px;border-radius:50%}
.st-lead{background:var(--blue-lt);color:var(--blue-dk)}
.st-active{background:var(--warn-lt);color:var(--warn)}
.st-completed{background:var(--ok-lt);color:var(--ok)}
.st-churned{background:var(--rule-2);color:var(--ink-l)}
.svc{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:8px;font-size:11.5px;font-weight:600}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;background:var(--cream);color:var(--ink-m);margin:2px 3px 2px 0;border:1px solid var(--rule-2)}

/* ---------- PIPELINE ---------- */
.board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--cream);border-radius:14px;padding:6px;min-height:120px;display:flex;flex-direction:column}
.col-h{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;font-size:12.5px;font-weight:700;letter-spacing:.03em}
.col-h .n{margin-left:auto;background:var(--white);color:var(--ink-m);font-size:11px;padding:1px 8px;border-radius:999px;font-weight:700}
.col-b{display:flex;flex-direction:column;gap:8px;padding:4px 6px 8px;flex:1}
.deal{background:var(--white);border:1px solid var(--rule);border-radius:11px;padding:12px 13px;box-shadow:var(--sh);cursor:grab;transition:.14s}
.deal:hover{box-shadow:var(--sh-lg);transform:translateY(-1px)}
.deal.drag{opacity:.45}
.deal .svc{margin-bottom:8px}
.deal .dn{font-weight:600;font-size:13px}
.deal .da{font-family:var(--disp);font-size:16px;font-weight:600;color:var(--green-dk);margin-top:6px}
.deal .dm{font-size:11px;color:var(--ink-l);margin-top:3px;display:flex;align-items:center;gap:5px}
.col.over{outline:2px dashed var(--rose);outline-offset:-2px}

/* ---------- CALENDAR ---------- */
.cal-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.cal-top h2{font-family:var(--serif);font-size:18px;font-weight:700;min-width:150px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:var(--white);display:grid;place-items:center}
.cal-nav button:hover{border-color:var(--rose);color:var(--rose-dk)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule-2);border:1px solid var(--rule-2);border-radius:14px;overflow:hidden}
.cal .dow{background:var(--cream);text-align:center;padding:10px 0;font-size:11.5px;font-weight:700;color:var(--ink-l);letter-spacing:.04em}
.cal .cell{background:var(--white);min-height:104px;padding:7px 8px;display:flex;flex-direction:column;gap:4px;transition:.12s}
.cal .cell:hover{background:var(--off)}
.cal .cell.dim{background:var(--off);color:var(--ink-l)}
.cal .cell.today .dnum{background:var(--rose);color:#fff}
.cal .dnum{align-self:flex-start;font-size:12px;font-weight:600;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.ev{font-size:11px;padding:3px 7px;border-radius:6px;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid}
.ev:hover{filter:brightness(.97)}

/* ---------- DETAIL / TABS ---------- */
.det-head{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.det-head .ava{width:64px;height:64px;font-size:26px}
.det-head h1{font-family:var(--serif);font-size:24px;font-weight:700}
.det-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-m);margin-top:6px}
.det-meta span{display:inline-flex;align-items:center;gap:6px}
.det-meta svg{width:14px;height:14px;color:var(--ink-l)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule-2);margin-bottom:20px}
.tabs button{padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--ink-l);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.tabs button.on{color:var(--rose-dk);border-bottom-color:var(--rose)}
.tabs button:hover{color:var(--ink)}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--rule-2)}
.tl-item{position:relative;padding:0 0 20px}
.tl-item::before{content:'';position:absolute;left:-24px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--white);border:3px solid var(--rose)}
.tl-item .tt{font-size:11.5px;color:var(--ink-l);margin-bottom:3px;display:flex;align-items:center;gap:8px}
.tl-item .tb{background:var(--cream);border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.7}
.act-type{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--rose-pale);color:var(--rose-dk)}

/* ---------- SITUATION SUMMARY (顧客詳細の現在状況) ---------- */
.sit{margin-bottom:22px}
.sit-hero{background:var(--white);border:1px solid var(--rule);border-left:5px solid var(--ink-l);border-radius:15px;box-shadow:var(--sh);padding:20px 22px;display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.sit-hero .si{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;flex:none}
.sit-hero .si svg{width:26px;height:26px;stroke-width:1.9}
.sit-body{flex:1;min-width:200px}
.sit-lab{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-l);text-transform:uppercase}
.sit-title{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.25;margin-top:3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sit-sub{font-size:13px;color:var(--ink-m);margin-top:6px;line-height:1.6}
.sit-next{margin-top:13px;background:var(--cream);border-radius:11px;padding:11px 14px;display:flex;align-items:center;gap:11px;font-size:13.5px}
.sit-next .nx-lab{font-size:10.5px;font-weight:700;color:var(--ink-l);letter-spacing:.04em;flex:none}
.sit-next.over{background:var(--danger-lt)}
.sit-act{display:flex;flex-direction:column;gap:8px;align-items:stretch;flex:none}
.sit-act .btn{justify-content:center}
.sit-alert{margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--danger-lt);color:var(--danger);font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:11px}
.sit-alert svg{width:15px;height:15px;flex:none}
.sit-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.sit-tile{background:var(--white);border:1px solid var(--rule);border-radius:13px;padding:14px 16px;box-shadow:var(--sh);min-width:0}
.sit-tile .tl-lab{font-size:11px;color:var(--ink-l);font-weight:600;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.sit-tile .tl-lab svg{width:13px;height:13px;color:var(--ink-l);flex:none}
.sit-tile .tl-val{font-family:var(--disp);font-size:23px;font-weight:600;line-height:1.1;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sit-tile .tl-val small{font-family:var(--sans);font-size:12px;color:var(--ink-l);font-weight:500;margin-left:2px}
.sit-tile .tl-meta{font-size:11px;color:var(--ink-l);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:1080px){.sit-tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.sit-tiles{grid-template-columns:1fr}.sit-hero{gap:14px}.sit-act{width:100%}.sit-next{flex-wrap:wrap;gap:6px 10px}.sit-next b{flex:1 1 100%}}

/* ---------- TASK / LIST ROWS ---------- */
.trow{display:flex;align-items:center;gap:13px;padding:13px 6px;border-bottom:1px solid var(--rule-2)}
.trow:last-child{border-bottom:none}
.tick{width:21px;height:21px;border-radius:6px;border:2px solid var(--rule);flex:none;display:grid;place-items:center;transition:.15s;cursor:pointer}
.tick.done{background:var(--ok);border-color:var(--ok)}
.tick svg{width:13px;height:13px;color:#fff;stroke-width:3;opacity:0}
.tick.done svg{opacity:1}
.trow.is-done .tk-title{text-decoration:line-through;color:var(--ink-l)}
.tk-title{font-weight:500;flex:1}
.tk-due{font-size:12px;color:var(--ink-l);display:flex;align-items:center;gap:5px}
.tk-due.over{color:var(--danger);font-weight:600}
.pri-high{color:var(--danger)}

/* ---------- MODAL ---------- */
.ov{position:fixed;inset:0;background:rgba(35,33,31,.42);backdrop-filter:blur(3px);z-index:200;display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:.2s}
.ov.on{opacity:1;pointer-events:auto}
.modal{background:var(--white);border-radius:18px;width:100%;max-width:540px;max-height:90vh;overflow:auto;box-shadow:var(--sh-lg);transform:translateY(12px) scale(.98);transition:.22s}
.ov.on .modal{transform:none}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--rule-2);position:sticky;top:0;background:var(--white);z-index:2}
.modal-h h3{font-family:var(--serif);font-size:17px;font-weight:700}
.modal-h .x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-l)}
.modal-h .x:hover{background:var(--cream);color:var(--ink)}
.modal-b{padding:22px 24px}
.modal-f{padding:16px 24px;border-top:1px solid var(--rule-2);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--white)}
.fg{margin-bottom:15px}
.fg.row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--ink-m);margin-bottom:6px;letter-spacing:.02em}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 13px;border:1px solid var(--rule);border-radius:9px;background:var(--off);outline:none;transition:.15s;color:var(--ink)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-pale);background:var(--white)}
.fg textarea{resize:vertical;min-height:76px;line-height:1.6}
.hint{font-size:11.5px;color:var(--ink-l);margin-top:6px;line-height:1.6}

/* ---------- MISC ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--ink-l)}
.empty svg{width:40px;height:40px;margin-bottom:12px;opacity:.5}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.bar-row .bl{width:112px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.bar-track{flex:1;height:9px;background:var(--cream);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
.bar-val{width:78px;text-align:right;font-family:var(--disp);font-size:15px;font-weight:600}
.spark{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:10px}
.spark .b{flex:1;background:linear-gradient(180deg,var(--rose) 0%,var(--rose-lt) 100%);border-radius:6px 6px 0 0;position:relative;min-height:3px;transition:height .6s cubic-bezier(.2,.7,.3,1)}
.spark .b span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--ink-l)}
.spark .b em{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:10.5px;font-style:normal;font-weight:600;color:var(--green-dk)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:var(--sh-lg);z-index:400;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mob-btn{display:none}

/* ---------- AUTH GATE ---------- */
.app{display:none}
body.authed .app{display:grid}
body.authed #login{display:none}
#login{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 120% at 80% -10%,#F4EAE3 0%,#FBFAF8 44%,#F7F1EA 100%)}
.login-card{width:100%;max-width:400px;background:var(--white);border:1px solid var(--rule);border-radius:22px;box-shadow:0 20px 70px rgba(126,65,41,.16);padding:40px 36px 34px;text-align:center}
.login-logo{width:56px;height:56px;border-radius:14px;background:var(--rose);display:grid;place-items:center;font-family:var(--disp);font-size:32px;font-weight:600;color:#fff;margin:0 auto 18px}
.login-card h1{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:.04em}
.login-card .sub{font-size:12.5px;color:var(--ink-l);margin-top:5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:26px}
.login-card form{text-align:left}

.login-err{background:var(--danger-lt);color:var(--danger);font-size:12.5px;font-weight:500;padding:10px 13px;border-radius:9px;margin-bottom:14px;display:none;text-align:left}

.login-note{font-size:11.5px;color:var(--ink-l);margin-top:20px;padding-top:18px;border-top:1px solid var(--rule-2);line-height:1.7}

.side-user{display:flex;align-items:center;gap:9px;padding:9px 8px 4px;font-size:12px;color:#CBB6AA;min-width:0}

.side-foot button.logout{margin-top:8px;border-color:rgba(224,140,120,.4);color:#E0A090}
.side-foot button.logout:hover{background:rgba(192,85,74,.2);color:#fff}

/* ---------- ICON BUTTON / MENUS / THEME ---------- */
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--rule);background:var(--white);display:grid;place-items:center;color:var(--ink-m);transition:.15s;flex:none}
.icon-btn:hover{border-color:var(--rose);color:var(--rose-dk)}
.icon-btn svg{width:18px;height:18px;stroke-width:1.8}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--white);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--sh-lg);padding:6px;min-width:230px;z-index:60;display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-m);text-align:left;transition:.12s}

.gcal-btn svg{width:13px;height:13px}
.fore-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fore{background:var(--cream);border-radius:12px;padding:14px 16px}
.fore .fl{font-size:11.5px;color:var(--ink-l);font-weight:500}
.fore .fv{font-family:var(--disp);font-size:24px;font-weight:600;color:var(--green-dk);margin-top:3px}

/* ---------- DARK THEME ---------- */
:root[data-theme="dark"]{
  --white:#242120; --off:#1A1817; --cream:#2B2724; --stone:#332E2A;
  --ink:#F1EAE4; --ink-m:#CBBFB6; --ink-l:#968A81;

/* ---------- PRINT ---------- */
@media print{
  .side,.topbar,.tabs,#backBtn,.btn,.icon-btn,.ov,.toast,[data-edit],[data-del]{display:none!important}

}

@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.fore-grid{grid-template-columns:1fr}}

<script type="module">
// Supabase クライアントは連携設定がある場合のみ動的に読み込む（デモモードは完全オフライン動作）
const SUPABASE_CDN='https://esm.sh/@supabase/supabase-js@2';

// ストレージが使えない環境（サンドボックス等）ではメモリ内に退避してクラッシュを防ぐ
function safeStore(real){
  try{ const k='__lb_test__'; real.setItem(k,'1'); real.removeItem(k); return real; }
  catch(e){ const m={}; return {getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];},clear:()=>{for(const k in m)delete m[k];}}; }
}
const LS=safeStore(window.localStorage), SS=safeStore(window.sessionStorage);

/* ================= ICONS ================= */
const IC = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 6a3 3 0 0 1 0 5.6"/><path d="M17 20a5.5 5.5 0 0 0-2-4"/>',
  board:'<rect x="3" y="4" width="5" height="16" rx="1.4"/><rect x="10" y="4" width="5" height="11" rx="1.4"/><rect x="17" y="4" width="4" height="14" rx="1.4"/>',
  cal:'<rect x="3" y="4.5" width="18" height="16" rx="2.2"/><path d="M3 9h18M8 3v3.5M16 3v3.5"/>',
  check:'<path d="M20 7 10 17l-5-5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  yen:'<path d="M12 4 8 11h8L12 4zM12 11v9M8 14h8M8 17h8"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  spark:'<path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.5 2.5M16.5 16.5 19 19M19 5l-2.5 2.5M7.5 16.5 5 19"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  phone:'<path d="M5 4h4l1.5 5-2 1.5a12 12 0 0 0 5 5l1.5-2 5 1.5v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  edit:'<path d="M4 20h4L18 10l-4-4L4 16v4z"/><path d="M13 5l4 4"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>', chevR:'<path d="M9 6l6 6-6 6"/>',
  tag:'<path d="M3 12V4h8l9 9-8 8-9-9z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
  note:'<path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M9 12h6M9 16h6"/>',
  logout:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 12H2m0 0 3-3m-3 3 3 3"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',
  dots:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  download:'<path d="M12 3v12m0 0 4-4m-4 4-4-4M4 20h16"/>',
  upload:'<path d="M12 21V9m0 0 4 4m-4-4-4 4M4 4h16"/>',
  print:'<path d="M6 9V3h12v6M6 18H4v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6h-2M8 14h8v7H8z"/>',
  gcal:'<rect x="3" y="4.5" width="18" height="16" rx="2.2"/><path d="M3 9h18M8 3v3.5M16 3v3.5"/><path d="M12 13v3.5M10.3 14.7 12 13l1.7 1.7"/>'
};
const svg=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${IC[k]||''}</svg>`;
document.querySelectorAll('.nav a,#topAdd,#cfgBtn,#mobBtn,#logoutBtn,#themeBtn,#toolsBtn,#toolsMenu,.search').forEach(el=>{
  el.innerHTML=el.innerHTML
    .replace(/\$\{'ICON_home'\}/g,svg('home')).replace(/\$\{'ICON_users'\}/g,svg('users'))
    .replace(/\$\{'ICON_board'\}/g,svg('board')).replace(/\$\{'ICON_cal'\}/g,svg('cal'))
    .replace(/\$\{'ICON_check'\}/g,svg('check')).replace(/\$\{'ICON_gear'\}/g,svg('gear'))
    .replace(/\$\{'ICON_menu'\}/g,svg('menu')).replace(/\$\{'ICON_search'\}/g,svg('search'))
    .replace(/\$\{'ICON_plus'\}/g,svg('plus')).replace(/\$\{'ICON_logout'\}/g,svg('logout'))
    .replace(/\$\{'ICON_moon'\}/g,svg('moon')).replace(/\$\{'ICON_dots'\}/g,svg('dots'))
    .replace(/\$\{'ICON_download'\}/g,svg('download')).replace(/\$\{'ICON_upload'\}/g,svg('upload'));
});

/* ================= CONFIG / CONSTANTS ================= */
const SERVICES={
  asset_report:{label:'資産戦略レポート',color:'#9C6B58',bg:'#F4EAE3'},
  bank_account:{label:'銀行口座開設',color:'#5C8A5A',bg:'#E6F0E4'},
  pma:{label:'PMA法人設立',color:'#AE655A',bg:'#F3DCD3'},
  real_estate:{label:'不動産仲介',color:'#C79A55',bg:'#F5ECD8'}
};
const STAGES=[
  {k:'inquiry',label:'問い合わせ',color:'#9C6B58'},
  {k:'proposal',label:'提案中',color:'#C79A55'},
  {k:'in_progress',label:'進行中',color:'#BE6B4C'},
  {k:'review',label:'確認待ち',color:'#AE655A'},
  {k:'completed',label:'完了',color:'#5C8A5A'},
  {k:'lost',label:'失注',color:'#8B7D76'}
];
const STATUS={lead:'リード',active:'進行中',completed:'成約済',churned:'失注'};
const EVKIND={meeting:{l:'商談',c:'#AE655A'},call:{l:'電話',c:'#5C8A5A'},visit:{l:'訪問',c:'#C79A55'},deadline:{l:'期限',c:'#C0554A'},other:{l:'その他',c:'#8B7D76'}};
// 対応状況（ボールがどちらにあるか）
const WAIT={
  us:{label:'要対応',short:'あなたの番',bg:'#F8E4E0',fg:'#C0554A',dot:'#C0554A'},
  them:{label:'返信待ち',short:'先方の番',bg:'#EDE7F0',fg:'#7A6A8A',dot:'#9C86B0'},
  none:{label:'対応不要',short:'—',bg:'var(--cream)',fg:'var(--ink-l)',dot:'#B8ADA4'}
};
const FOLLOWUP_DAYS=5; // 先方待ちがこの日数を超えたら「催促どき」

/* ================= STORE (Supabase or local demo) ================= */
const TABLES=['customers','deals','activities','tasks','events'];
// 既定のSupabase接続（アプリに組み込み＝全端末で自動接続）。
// publishableキーは公開前提の安全なキー。データはRLS＋ログイン認証で保護。
const DEFAULT_SUPA={url:'https://zqigwurejpaeakyvmool.supabase.co', key:'sb_publishable_65bYmfxT7MzJKtPEPMViVQ_qEXmSTse'};
const store={
  sb:null, live:false, initError:'',
  cfg:{url:LS.getItem('lb_url')||DEFAULT_SUPA.url, key:LS.getItem('lb_key')||DEFAULT_SUPA.key},
  cache:{},
  // Supabase本体をロード：まず同梱ファイル、ダメならCDNフォールバック
  async loadSupabaseLib(){
    if(window.supabase?.createClient) return window.supabase;
    const inject=(src)=>new Promise((res,rej)=>{
      const s=document.createElement('script'); s.src=src; s.async=true;
      s.onload=()=>res(); s.onerror=()=>rej(new Error('script load failed: '+src));
      document.head.appendChild(s);
    });
    try{ await inject('./supabase.min.js'); }catch(e){ console.warn(e.message); }
    if(window.supabase?.createClient) return window.supabase;
    try{ const m=await import(SUPABASE_CDN); if(m?.createClient) window.supabase={createClient:m.createClient}; }catch(e){ console.warn('CDN fallback失敗:',e.message); }
    return window.supabase;
  },
  async initClient(){
    this.initError='';
    if(this.cfg.url && this.cfg.key){
      try{
        const lib=await this.loadSupabaseLib();
        if(!lib?.createClient) throw new Error('Supabaseの部品を読み込めませんでした。通信環境やブラウザ設定をご確認ください。');
        this.sb=lib.createClient(this.cfg.url,this.cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});
        // 接続テスト（キー誤り・テーブル未作成などをここで検知）。URL誤りで固まらないようタイムアウト付き
        const result=await Promise.race([
          this.sb.from('customers').select('id').limit(1),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error('接続タイムアウト。Project URL が正しいかご確認ください')),8000))
        ]);
        if(result&&result.error) throw new Error(result.error.message||'接続テストに失敗しました');
        this.live=true;
      }catch(e){
        this.initError=e.message||String(e);
        console.warn('Supabase接続に失敗、デモモードで起動します:',this.initError);
        this.sb=null; this.live=false;
      }
    }
    setConn();
  },
  async loadData(){
    if(this.live){
      try{ await this.loadAll(); }
      catch(e){ toast('データ取得エラー: '+e.message); console.warn(e); }
    }else{
      this.loadDemo();
    }
  },
  async loadAll(){
    for(const t of TABLES){
      const {data}=await this.sb.from(t).select('*');
      this.cache[t]=data||[];
    }
  },
  loadDemo(){
    const saved=LS.getItem('lb_demo');
    if(saved){ this.cache=JSON.parse(saved); return; }
    this.cache=SEED();
    this.persistDemo();
  },
  persistDemo(){ if(!this.live) LS.setItem('lb_demo',JSON.stringify(this.cache)); },
  all(t){ return this.cache[t]||[]; },
  async insert(t,row){
    if(this.live){
      const {data,error}=await this.sb.from(t).insert(row).select().single();
      if(error){toast('保存エラー: '+error.message);return null;}
      this.cache[t].push(data); return data;
    }
    const r={id:uid(),created_at:new Date().toISOString(),...row};

/* ================= FORECAST (weighted pipeline) ================= */
const STAGE_PROB={inquiry:0.1,proposal:0.4,in_progress:0.65,review:0.85,completed:1,lost:0};
function forecast(){
  const deals=store.all('deals');
  const open=deals.filter(d=>!['completed','lost'].includes(d.stage));
  const weighted=open.reduce((a,d)=>a+Number(d.amount||0)*(STAGE_PROB[d.stage]||0),0);
  const raw=open.reduce((a,d)=>a+Number(d.amount||0),0);
  const won=deals.filter(d=>d.stage==='completed').reduce((a,d)=>a+Number(d.amount||0),0);
  return {weighted,raw,won,openCount:open.length};
}

  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Leaves Bali CRM//JP','CALSCALE:GREGORIAN'];

    L.push('BEGIN:VEVENT',`UID:${e.id}@leaves-bali`,`DTSTAMP:${icsStamp(new Date())}`,
      `DTSTART:${icsStamp(e.start_at)}`,`DTEND:${icsStamp(evEnd(e))}`,

function download(filename,text,mime='text/plain'){
  const blob=new Blob([text],{type:mime+';charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},100);
}
function pickFile(accept,cb){
  const i=document.createElement('input'); i.type='file'; i.accept=accept;
  i.onchange=()=>{const f=i.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>cb(r.result,f.name); r.readAsText(f);};
  i.click();
}

function parseCSV(text){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else{ if(ch==='"')q=true; else if(ch===',')  {row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(ch!=='\r')cur+=ch; }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

        if(!r[0]||!r[0].trim())continue;
        await store.insert('customers',{
          name:r[0].trim(),name_kana:r[1]||'',email:r[2]||'',phone:r[3]||'',company:r[4]||'',country:r[5]||'日本',
          status:statusRev[r[6]]||(['lead','active','completed','churned'].includes(r[6])?r[6]:'lead'),
          source:r[7]||'',assignee:r[8]||'',
          tags:(r[9]||'').split(/[\/,、]/).map(s=>s.trim()).filter(Boolean),notes:r[10]||''
        }); n++;
      }
      toast(`${n}件の顧客を取り込みました`); refreshCurrent();
    }catch(e){ toast('取り込みエラー: '+e.message); }
  });
}

/* ================= ROUTER ================= */
const ROUTES={
  dashboard:{t:'ダッシュボード',s:'本日の状況サマリー',render:renderDashboard},
  customers:{t:'顧客管理',s:'顧客の一覧と詳細',render:renderCustomers},
  pipeline:{t:'案件パイプライン',s:'サービス進捗をステージ別に管理',render:renderPipeline},
  calendar:{t:'カレンダー',s:'予定・スケジュール',render:renderCalendar},
  tasks:{t:'タスク',s:'対応漏れを防ぐToDo管理',render:renderTasks}
};
let cur='dashboard', detailId=null, searchQ='';
function go(route,opt={}){
  cur=route; detailId=opt.detailId||null;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.route===route));
  const r=ROUTES[route];
  $('#pgTitle').textContent=detailId?'顧客詳細':r.t;
  $('#pgSub').textContent=detailId?'':r.s;
  $('#side').classList.remove('open');
  window.scrollTo(0,0);
  // 予期しないデータ不整合で描画が止まり「押しても何も起きない」状態になるのを防ぐ
  try{
    if(detailId) renderDetail(detailId); else r.render();
  }catch(err){
    console.error('描画エラー:',err);
    toast('表示中に問題が発生しました（データをご確認ください）');
    if(detailId){detailId=null;try{renderCustomers();}catch(e2){console.error(e2);}}
  }
}
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>go(a.dataset.route));

  const custs=store.all('customers'), deals=store.all('deals');
  const active=custs.filter(c=>c.status==='active').length;
  const openDeals=deals.filter(d=>!['completed','lost'].includes(d.stage));
  const won=deals.filter(d=>d.stage==='completed');
  const revenue=won.reduce((a,d)=>a+Number(d.amount||0),0);
  const pipeline=openDeals.reduce((a,d)=>a+Number(d.amount||0),0);
  const wonCount=won.length, lostCount=deals.filter(d=>d.stage==='lost').length;
  const winRate=(wonCount+lostCount)?Math.round(wonCount/(wonCount+lostCount)*100):0;

  // サービス別売上
  const bySvc={}; Object.keys(SERVICES).forEach(k=>bySvc[k]=0);
  won.forEach(d=>{if(d.service_type in bySvc)bySvc[d.service_type]+=Number(d.amount||0);});
  const maxSvc=Math.max(1,...Object.values(bySvc));

  // 月別成約（過去6ヶ月）
  const months=[]; const nd=new Date();
  for(let i=5;i>=0;i--){const m=new Date(nd.getFullYear(),nd.getMonth()-i,1);months.push({y:m.getFullYear(),m:m.getMonth(),label:`${m.getMonth()+1}月`,val:0});}
  won.forEach(d=>{const dt=new Date(d.expected_close_date||d.created_at);const mm=months.find(x=>x.y===dt.getFullYear()&&x.m===dt.getMonth());if(mm)mm.val+=Number(d.amount||0);});

  const upcoming=[...store.all('events')].filter(e=>new Date(e.start_at)>=new Date(new Date().toDateString())).sort((a,b)=>new Date(a.start_at)-new Date(b.start_at)).slice(0,5);
  const todos=store.all('tasks').filter(t=>!t.done).sort((a,b)=>new Date(a.due_date||'2999')-new Date(b.due_date||'2999')).slice(0,5);

  const kpi=(ic,bg,col,lab,val,unit,meta)=>`
    <div class="kpi">
      <div class="ic" style="background:${bg};color:${col}">${svg(ic)}</div>
      <div class="lab">${lab}</div>
      <div class="val">${val}${unit?`<small>${unit}</small>`:''}</div>
      <div class="meta">${meta}</div>
    </div>`;

  const needAction=needActionList(), waiting=waitingList();
  const actRow=(c,mode)=>{
    const d=mode==='us'?c.next_action_date:c.last_contact;
    const overdue=mode==='us'&&isOverdue(c.next_action_date);
    const wdays=mode==='them'?daysSince(c.last_contact):null;
    const chase=mode==='them'&&wdays!=null&&wdays>=FOLLOWUP_DAYS;
    return `<div class="trow" data-open="${c.id}" style="padding:12px 6px;cursor:pointer">
      ${ava(c)}
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px">${esc(c.name)}${chase?' <span class="chip" style="background:var(--warn-lt);color:var(--warn);padding:1px 7px">催促どき</span>':''}</div>
        <div style="font-size:11.5px;color:var(--ink-l);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(mode==='us'?(c.next_action||'次のアクション未設定'):(c.next_action||'返信待ち'))}</div>
      </div>
      ${mode==='us'
        ? `<span class="tk-due ${overdue?'over':''}" style="white-space:nowrap">${svg('clock')}${c.next_action_date?fmtDate(c.next_action_date):'期限なし'}</span>`
        : `<span class="tk-due ${chase?'over':''}" style="white-space:nowrap">${wdays!=null?wdays+'日待ち':'—'}</span>`}
    </div>`;
  };
  $('#view').innerHTML=`
    <div class="kpis">
      ${kpi('users','#F3DCD3','#AE655A','アクティブ顧客',active,'件',`全 ${custs.length} 件のうち`)}
      ${kpi('briefcase','#F5ECD8','#C79A55','進行中案件',openDeals.length,'件',`パイプ総額 ${yen(pipeline)}`)}
      ${kpi('yen','#E6F0E4','#5C8A5A','成約売上',(revenue/10000).toLocaleString('ja-JP',{maximumFractionDigits:0}),'万円',`成約 ${wonCount} 件`)}
      ${kpi('trend','#F4EAE3','#9C6B58','成約率',winRate,'%',`勝 ${wonCount} / 負 ${lostCount}`)}
    </div>

    <div class="grid-2" style="margin-bottom:22px">
      <div class="panel" style="border-left:3px solid var(--danger)">
        <div class="panel-h"><span class="cd" style="width:9px;height:9px;border-radius:50%;background:var(--danger)"></span><h2>要対応（あなたの番）</h2><span class="spacer"></span><span class="chip st-active" style="background:var(--danger-lt);color:var(--danger)">${needAction.length}件</span></div>
        <div class="panel-b" style="padding:8px 14px">
          ${needAction.length?needAction.map(c=>actRow(c,'us')).join(''):'<div class="empty" style="padding:24px">対応待ちはありません 🎉</div>'}
        </div>
      </div>
      <div class="panel" style="border-left:3px solid #9C86B0">
        <div class="panel-h"><span class="cd" style="width:9px;height:9px;border-radius:50%;background:#9C86B0"></span><h2>先方の返信待ち</h2><span class="spacer"></span><span class="chip" style="background:#EDE7F0;color:#7A6A8A">${waiting.length}件</span></div>
        <div class="panel-b" style="padding:8px 14px">
          ${waiting.length?waiting.map(c=>actRow(c,'them')).join(''):'<div class="empty" style="padding:24px">返信待ちはありません</div>'}
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div>
        <div class="panel">
          <div class="panel-h"><h2>月別 成約売上</h2><span class="spacer"></span><span style="font-size:12px;color:var(--ink-l)">直近6ヶ月</span></div>
          <div class="panel-b">
            <div class="spark">
              ${months.map(m=>`<div class="b" style="height:${Math.max(3,m.val/maxM*100)}%"><em>${m.val?Math.round(m.val/10000)+'万':''}</em><span>${m.label}</span></div>`).join('')}
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-h"><h2>サービス別 成約売上</h2></div>
          <div class="panel-b">
            ${Object.entries(bySvc).map(([k,v])=>`
              <div class="bar-row">
                <div class="bl"><span class="cd" style="width:8px;height:8px;border-radius:2px;background:${SERVICES[k].color};display:inline-block"></span>${SERVICES[k].label}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${v/maxSvc*100}%;background:${SERVICES[k].color}"></div></div>
                <div class="bar-val">${v?Math.round(v/10000)+'万':'—'}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <div class="panel-h"><h2>直近の予定</h2><span class="spacer"></span><button class="btn gho sm" data-nav="calendar">カレンダー</button></div>
          <div class="panel-b" style="padding-top:8px">
            ${upcoming.length?upcoming.map(e=>{const c=custById(e.customer_id);const k=EVKIND[e.kind]||EVKIND.other;return `

                  <div style="font-size:11.5px;color:var(--ink-l)">${fmtDT(e.start_at)}${c?' ・ '+esc(c.name):''}${e.location?' ・ '+esc(e.location):''}</div>
                </div>

/* ================= CUSTOMERS ================= */
let custFilter='all';
function renderCustomers(){
  let list=store.all('customers').slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(custFilter==='wait_us')list=list.filter(c=>c.waiting_on==='us');
  else if(custFilter==='wait_them')list=list.filter(c=>c.waiting_on==='them');
  else if(custFilter!=='all') list=list.filter(c=>c.status===custFilter);
  if(searchQ) list=list.filter(c=>(`${c.name}${c.name_kana}${c.company}${c.email}${(c.tags||[]).join('')}`).toLowerCase().includes(searchQ.toLowerCase()));
  const counts={all:store.all('customers').length,
    wait_us:store.all('customers').filter(c=>c.waiting_on==='us').length,
    wait_them:store.all('customers').filter(c=>c.waiting_on==='them').length};
  Object.keys(STATUS).forEach(k=>counts[k]=store.all('customers').filter(c=>c.status===k).length);
  const pill=(k,l)=>`<button class="btn ${custFilter===k?'pri':'gho'} sm" data-filter="${k}" style="border-radius:999px">${l} <b style="opacity:.7;margin-left:2px">${counts[k]||0}</b></button>`;

      ${pill('all','すべて')}${pill('lead','リード')}${pill('active','進行中')}${pill('completed','成約済')}${pill('churned','失注')}
      <span style="width:1px;height:22px;background:var(--rule-2);margin:0 2px"></span>
      ${pill('wait_us','🔴 要対応')}${pill('wait_them','🕐 返信待ち')}
    </div>
    <div class="panel">
      <div class="panel-b" style="padding:6px 10px;overflow-x:auto">
        ${list.length?`<table><thead><tr>
          <th>顧客</th><th>ステータス</th><th>対応状況</th><th>次にやること</th><th>担当</th><th>案件</th><th></th>
        </tr></thead><tbody>
        ${list.map(c=>{const ds=dealsOf(c.id);const open=ds.filter(d=>!['completed','lost'].includes(d.stage)).length;return `
          <tr data-open="${c.id}">
            <td><div class="cust-cell">${ava(c)}<div><div class="cust-name">${esc(c.name)}</div><div class="cust-sub">${esc(c.company||c.name_kana||c.email||'')}</div></div></div></td>

            <td>${waitBadge(c)||'<span style="color:var(--ink-l);font-size:12px">—</span>'}</td>
            <td style="font-size:12.5px;color:var(--ink-m);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.waiting_on==='us'?esc(c.next_action||''):''}</td>
            <td style="font-size:13px">${esc(c.assignee||'—')}</td>
            <td><span style="font-weight:600">${ds.length}</span><span style="color:var(--ink-l);font-size:12px"> 件${open?` (進行${open})`:''}</span></td>
            <td style="text-align:right"><button class="btn gho sm" data-edit="${c.id}">${svg('edit')}</button></td>
          </tr>`;}).join('')}
        </tbody></table>`:`<div class="empty">${svg('users')}<div>該当する顧客がいません</div></div>`}
      </div>
    </div>`;
  $('#view').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{custFilter=b.dataset.filter;renderCustomers();});
  $('#view').querySelectorAll('[data-open]').forEach(tr=>tr.onclick=(e)=>{if(e.target.closest('[data-edit]'))return;go('customers',{detailId:tr.dataset.open});});
  $('#view').querySelectorAll('[data-edit]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();openCustomerModal(b.dataset.edit);});
}

    body=`<div class="sit">${heroHTML}${alertHTML}${tilesHTML}</div>
    <div class="grid-2">

      <div class="fore"><div class="fl">加重売上予測（受注確度反映）</div><div class="fv" style="color:var(--rose-dk)">${yen(Math.round(fc.weighted))}</div></div>

/* ================= CALENDAR ================= */
let calY,calM;
function renderCalendar(){
  const now=new Date();
  if(calY==null){calY=now.getFullYear();calM=now.getMonth();}
  const first=new Date(calY,calM,1), start=first.getDay(), days=new Date(calY,calM+1,0).getDate();
  const prevDays=new Date(calY,calM,0).getDate();
  const evByDay={};
  store.all('events').forEach(e=>{const d=new Date(e.start_at);if(d.getFullYear()===calY&&d.getMonth()===calM){(evByDay[d.getDate()]=evByDay[d.getDate()]||[]).push(e);}});
  const todayStr=now.toDateString();
  const cells=[];
  for(let i=0;i<start;i++)cells.push(`<div class="cell dim"><span class="dnum">${prevDays-start+i+1}</span></div>`);
  for(let d=1;d<=days;d++){
    const cellDate=new Date(calY,calM,d);
    const evs=(evByDay[d]||[]).sort((a,b)=>new Date(a.start_at)-new Date(b.start_at));
    cells.push(`<div class="cell ${cellDate.toDateString()===todayStr?'today':''}" data-day="${d}">
      <span class="dnum">${d}</span>
      ${evs.slice(0,3).map(e=>{const k=EVKIND[e.kind]||EVKIND.other;return `<div class="ev" style="background:${k.c}18;color:${k.c};border-color:${k.c}" data-ev="${e.id}">${new Date(e.start_at).getHours()?String(new Date(e.start_at).getHours()).padStart(2,'0')+':'+String(new Date(e.start_at).getMinutes()).padStart(2,'0')+' ':''}${esc(e.title)}</div>`;}).join('')}
      ${evs.length>3?`<div style="font-size:10.5px;color:var(--ink-l);padding-left:4px">+${evs.length-3}件</div>`:''}
    </div>`);
  }
  const totalCells=start+days; for(let i=0;i<(7-totalCells%7)%7;i++)cells.push(`<div class="cell dim"><span class="dnum">${i+1}</span></div>`);

  $('#view').innerHTML=`
    <div class="cal-top">
      <h2>${calY}年 ${calM+1}月</h2>
      <div class="cal-nav"><button id="calPrev">${svg('chevL')}</button><button id="calToday" style="width:auto;padding:0 14px;font-size:12.5px;font-weight:600">今日</button><button id="calNext">${svg('chevR')}</button></div>
      <span class="spacer" style="flex:1"></span>
      <button class="btn pri" id="addEv">${svg('plus')}予定を追加</button>
    </div>
    <div class="cal">
      ${['日','月','火','水','木','金','土'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells.join('')}
    </div>`;
  $('#calPrev').onclick=()=>{calM--;if(calM<0){calM=11;calY--;}renderCalendar();};
  $('#calNext').onclick=()=>{calM++;if(calM>11){calM=0;calY++;}renderCalendar();};
  $('#calToday').onclick=()=>{calY=now.getFullYear();calM=now.getMonth();renderCalendar();};
  $('#addEv').onclick=()=>openEventModal();
  $('#view').querySelectorAll('[data-ev]').forEach(el=>el.onclick=(e)=>{e.stopPropagation();openEventModal(el.dataset.ev);});
  $('#view').querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{
    const dd=String(calM+1).padStart(2,'0'),day=String(el.dataset.day).padStart(2,'0');
    openEventModal(null,null,`${calY}-${dd}-${day}T10:00`);
  });
}

function bindTaskTicks(){
  document.querySelectorAll('.tick[data-task]').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const t=store.all('tasks').find(x=>x.id===el.dataset.task); if(!t)return;
    await store.update('tasks',t.id,{done:!t.done});
    if(detailId)renderDetail(detailId); else ROUTES[cur].render();
  });
}
async function remindTask(id){
  const t=store.all('tasks').find(x=>x.id===id); if(!t)return;
  if(!store.live||!store.sb){toast('リマインドはクラウド接続（ログイン）時のみ利用できます');return;}
  if(!t.assignee){toast('先に担当を設定してください');return;}
  toast('リマインドを送信中…');
  try{
    const {data,error}=await store.sb.functions.invoke('notify-task',{body:{id}});
    if(error)throw error;
    if(data&&data.skipped==='no-email-for-assignee'){toast('この担当にはメールアドレスが未登録です');return;}
    if(data&&data.skipped==='already-done'){toast('このタスクは完了済みです');return;}
    const rc=(data&&data.recipients)||[];
    toast(rc.length?('リマインドを送信しました → '+rc.join(', ')):'送信対象がありませんでした');
  }catch(err){toast('送信に失敗しました: '+(err.message||err));}
}
function bindRemind(root){(root||document).querySelectorAll('[data-remind]').forEach(b=>b.onclick=()=>remindTask(b.dataset.remind));}

        ${field('ステータス','status',c.status||'lead','select',Object.entries(STATUS).map(([v,l])=>({v,l})))}
        ${field('流入元','source',c.source||'資産戦略診断','select',['資産戦略診断','紹介','広告','セミナー','SNS','その他'].map(x=>({v:x,l:x})))}
      </div>
      <div class="fg row">${field('担当者','assignee',c.assignee)}${field('タグ（カンマ区切り）','tags',(c.tags||[]).join(', '))}</div>
      <div style="background:var(--cream);border-radius:11px;padding:14px 15px;margin-bottom:15px">
        <div style="font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-l);margin-bottom:11px">対応状況（ボールはどちらに？）</div>
        <div class="fg row" style="margin-bottom:11px">
          ${field('状況','waiting_on',c.waiting_on||'none','select',[['us','要対応（あなたの番）'],['them','返信待ち（先方の番）'],['none','対応不要']].map(([v,l])=>({v,l})))}
          ${field('次アクションの期限','next_action_date',c.next_action_date,'date')}
        </div>
        ${field('次にやること','next_action',c.next_action)}
      </div>
      ${field('メモ','notes',c.notes,'textarea')}
    </div>
    <div class="modal-f"><button type="button" class="btn gho" data-close>キャンセル</button><button type="submit" class="btn pri">${svg('check')}保存</button></div>
    </form>`);
  bindClose();
  $('#mForm').onsubmit=async(e)=>{e.preventDefault();
    const o=readForm(e.target);
    if(!o.name.trim()){toast('氏名を入力してください');return;}
    o.tags=o.tags?o.tags.split(',').map(s=>s.trim()).filter(Boolean):[];
    if(!o.next_action_date)o.next_action_date=null;
    if(id){await store.update('customers',id,o);toast('顧客を更新しました');}
    else{const r=await store.insert('customers',o);toast('顧客を登録しました');}
    closeModal();
    if(detailId)renderDetail(detailId); else if(cur==='customers')renderCustomers(); else ROUTES[cur].render();
  };
}

/* --- Activity modal --- */
function openActivityModal(custId){
  openModal(`
    <div class="modal-h"><h3>対応記録を追加</h3><button class="x" data-close>${svg('x')}</button></div>
    <form id="mForm"><div class="modal-b">
      <div class="fg row">
        ${field('種別','type','note','select',[['note','メモ'],['call','電話'],['email','メール'],['meeting','商談'],['line','LINE']].map(([v,l])=>({v,l})))}
        ${field('担当者','created_by','')}
      </div>
      ${field('内容 *','body','','textarea')}
      ${field('この記録のあと、ボールは？','after','keep','select',[['keep','変更しない'],['them','先方の返信待ちにする'],['us','自分の対応待ちにする'],['none','対応不要にする']].map(([v,l])=>({v,l})))}
    </div>
    <div class="modal-f"><button type="button" class="btn gho" data-close>キャンセル</button><button type="submit" class="btn pri">${svg('check')}記録する</button></div>
    </form>`);
  bindClose();
  $('#mForm').onsubmit=async(e)=>{e.preventDefault();const o=readForm(e.target);
    if(!o.body.trim()){toast('内容を入力してください');return;}
    const after=o.after; delete o.after;
    o.customer_id=custId;await store.insert('activities',o);
    // 記録したら最終接触日を今日に更新。必要ならボールの持ち手も更新
    const patch={last_contact:new Date().toISOString().slice(0,10)};
    if(after&&after!=='keep')patch.waiting_on=after;
    await store.update('customers',custId,patch);
    closeModal();toast('記録しました');renderDetail(custId);
  };
}

/* --- Task modal --- */
function openTaskModal(id,presetCust){
  const t=id?store.all('tasks').find(x=>x.id===id):{customer_id:presetCust,priority:'normal'};
  openModal(`
    <div class="modal-h"><h3>${id?'タスクを編集':'新規タスク'}</h3><button class="x" data-close>${svg('x')}</button></div>
    <form id="mForm"><div class="modal-b">
      ${field('タイトル *','title',t.title)}
      <div class="fg row">${field('期限','due_date',t.due_date,'date')}${field('優先度','priority',t.priority||'normal','select',[['low','低'],['normal','中'],['high','高']].map(([v,l])=>({v,l})))}</div>
      ${field('関連顧客','customer_id',t.customer_id||'','select',[{v:'',l:'（なし）'},...custOpts()])}
      ${field('担当','assignee',t.assignee||'','select',[{v:'',l:'（未割り当て）'},{v:'Suzu',l:'Suzu'},{v:'Yoshiko',l:'Yoshiko'},{v:'Suzu,Yoshiko',l:'Suzu ＆ Yoshiko'}])}
      ${field('メモ','notes',t.notes||'','textarea')}

    <div class="modal-f"><button type="button" class="btn gho" data-close>キャンセル</button><button type="submit" class="btn pri">${svg('check')}保存</button></div>
    </form>`);
  bindClose();
  $('#mForm').onsubmit=async(e)=>{e.preventDefault();const o=readForm(e.target);
    if(!o.title.trim()){toast('タイトルを入力してください');return;}

}

  const e0=id?store.all('events').find(x=>x.id===id):{customer_id:presetCust,kind:'meeting'};

    <form id="mForm"><div class="modal-b">
      ${field('タイトル *','title',e0.title)}
      <div class="fg row">${field('日時','start_at',startVal,'datetime-local')}${field('種別','kind',e0.kind||'meeting','select',Object.entries(EVKIND).map(([v,o])=>({v,l:o.l})))}</div>
      <div class="fg row">${field('場所','location',e0.location)}${field('関連顧客','customer_id',e0.customer_id||'','select',[{v:'',l:'（なし）'},...custOpts()])}</div>
      ${field('メモ','notes',e0.notes,'textarea')}
      ${id&&e0.start_at?`<a class="gcal-btn" href="${gcalUrl(e0)}" target="_blank" rel="noopener">${svg('gcal')}この予定をGoogleカレンダーに追加</a>`:''}

    <div class="modal-f">${id?`<button type="button" class="btn dng" id="delEv" style="margin-right:auto">${svg('trash')}削除</button>`:''}<button type="button" class="btn gho" data-close>キャンセル</button><button type="submit" class="btn pri">${svg('check')}保存</button></div>
    </form>`);
  bindClose();
  if(id)$('#delEv').onclick=async()=>{await store.remove('events',id);closeModal();toast('予定を削除しました');refreshCurrent();};
  $('#mForm').onsubmit=async(ev)=>{ev.preventDefault();const o=readForm(ev.target);
    if(!o.title.trim()){toast('タイトルを入力してください');return;}

/* --- Config modal --- */
function openConfigModal(){
  openModal(`
    <div class="modal-h"><h3>Supabase 連携設定</h3><button class="x" data-close>${svg('x')}</button></div>
    <div class="modal-b">
      <p class="hint" style="margin-bottom:16px">Supabaseの <b>Project URL</b> と <b>anon public key</b> を入力すると、クラウドDBと同期します。空欄のままだとブラウザ内（デモ）モードで動作します。<br>テーブルは同梱の <code>supabase-schema.sql</code> をSQL Editorで実行して作成してください。</p>
      <form id="cfgForm">
        ${field('Project URL','url',store.cfg.url,'text')}
        ${field('anon public key','key',store.cfg.key,'text')}
        <div class="hint">現在の状態：<b>${store.live?'🟢 Supabase接続中':'🟡 デモモード（ブラウザ内保存）'}</b>${(!store.live&&store.cfg.url&&store.initError)?`<br><span style="color:var(--danger)">⚠️ 接続失敗の理由：${esc(store.initError)}</span>`:''}</div>
      </form>
      ${!store.live?`
      <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--rule-2)">
        <p class="hint" style="margin-bottom:14px">デモモードのログイン情報（このブラウザにのみ保存されます）</p>
        <form id="credForm">
          <div class="fg row">${field('メールアドレス','email',demoCred().email,'email')}${field('パスワード','pass',demoCred().pass,'text')}</div>
        </form>
      </div>`:''}
    </div>
    <div class="modal-f">
      ${store.cfg.url?`<button class="btn gho" id="cfgClear" style="margin-right:auto">連携を解除</button>`:''}
      <button class="btn gho" data-close>閉じる</button>
      <button class="btn pri" id="cfgSave">${svg('check')}保存して再読み込み</button>
    </div>`);
  bindClose();
  $('#cfgSave').onclick=()=>{
    const o=readForm($('#cfgForm'));
    LS.setItem('lb_url',o.url.trim());LS.setItem('lb_key',o.key.trim());
    if($('#credForm')){const c=readForm($('#credForm'));if(c.email&&c.pass)LS.setItem('lb_demo_cred',JSON.stringify({email:c.email.trim(),pass:c.pass}));}
    toast('設定を保存しました。再読み込みします…');setTimeout(()=>location.reload(),700);
  };
  if($('#cfgClear'))$('#cfgClear').onclick=()=>{LS.removeItem('lb_url');LS.removeItem('lb_key');setTimeout(()=>location.reload(),300);};
}
$('#cfgBtn').onclick=openConfigModal;

function bindClose(){modal.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);}
function refreshCurrent(){if(detailId)renderDetail(detailId);else ROUTES[cur].render();}

/* ================= TOP-LEVEL BINDINGS ================= */
$('#topAdd').onclick=()=>openCustomerModal();
$('#mobBtn').onclick=()=>$('#side').classList.toggle('open');
$('#logoutBtn').onclick=()=>auth.signOut();
$('#themeBtn').onclick=toggleTheme;
$('#globalSearch').oninput=(e)=>{searchQ=e.target.value;if(cur!=='customers'){go('customers');}else{renderCustomers();}$('#globalSearch').focus();};

// ツールメニュー
const toolsMenu=$('#toolsMenu');
$('#toolsBtn').onclick=(e)=>{e.stopPropagation();toolsMenu.classList.toggle('on');};
document.addEventListener('click',()=>toolsMenu.classList.remove('on'));
toolsMenu.onclick=(e)=>e.stopPropagation();
toolsMenu.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
  toolsMenu.classList.remove('on');
  const t=b.dataset.tool;
  if(t==='ics'){const evs=store.all('events');if(!evs.length){toast('予定がありません');return;}download('leaves-bali-events.ics',buildICS(evs),'text/calendar');toast('予定を .ics で書き出しました');}
  else if(t==='backup')exportBackup();
  else if(t==='restore')importBackup();
  else if(t==='csvout')exportCustomersCSV();
  else if(t==='csvin')importCustomersCSV();
});

// キーボードショートカット
document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('authed'))return;
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if(e.key==='/'&&!typing){e.preventDefault();$('#globalSearch').focus();}
  else if(e.key==='n'&&!typing&&!ov.classList.contains('on')){e.preventDefault();openCustomerModal();}
  else if((e.key==='d')&&!typing&&e.altKey){e.preventDefault();toggleTheme();}
});
function setConn(){
  const dot=$('#connDot'),txt=$('#connTxt');
  if(store.live){dot.className='dot live';txt.textContent='Supabase 接続中';}
  else{dot.className='dot demo';txt.textContent='デモモード';}
}
function setUserUI(){
  const mail=auth.user?.email||'—';
  $('#suMail').textContent=mail; $('#suMail').title=mail;
  $('#suAva').textContent=(mail||'?').charAt(0).toUpperCase();
}

/* ================= LOGIN ================= */
function showLoginNote(){
  const note=$('#loginNote');
  if(store.live){ note.innerHTML='Supabaseで登録済みの<b>メールアドレスとパスワード</b>でログインしてください。'; return; }
  const c=demoCred();
  // キーは設定済みなのに接続に失敗している場合は、理由をはっきり表示
  if(store.cfg.url && store.initError){
    note.innerHTML=`<span style="color:var(--danger);font-weight:600">⚠️ Supabase接続に失敗しました</span><br>
      <span style="font-size:11px;color:var(--ink-l);word-break:break-all">理由：${esc(store.initError)}</span><br>
      <span style="opacity:.85">キー・URLをご確認のうえ、左下「Supabase 連携設定」で入れ直してください。今はデモ用（<b>${esc(c.email)}</b> / <b>${esc(c.pass)}</b>）でログインできます。</span>`;
    return;
  }
  note.innerHTML=`デモモードで動作中です。テスト用ログイン：<br><b>${esc(c.email)}</b> / <b>${esc(c.pass)}</b><br><span style="opacity:.8">※ 本番運用では左下の設定からSupabaseを連携してください。</span>`;
}
$('#loginForm').onsubmit=async(e)=>{
  e.preventDefault();
  const btn=$('#loginBtn'), err=$('#loginErr');
  err.classList.remove('on');
  btn.disabled=true; btn.textContent='認証中…';
  try{
    await auth.signIn($('#loginEmail').value,$('#loginPass').value);
    await enterApp();
  }catch(ex){
    err.textContent=ex.message||'ログインに失敗しました'; err.classList.add('on');
    $('#loginPass').value=''; $('#loginPass').focus();
  }finally{ btn.disabled=false; btn.textContent='ログイン'; }
};

async function enterApp(){
  await store.loadData();
  setUserUI();
  document.body.classList.add('authed');
  go('dashboard');
}

/* ================= BOOT ================= */
applyTheme(LS.getItem('lb_theme')||'light');
(async()=>{
  await store.initClient();
  const authed=await auth.check();
  if(authed){ await enterApp(); }
  else{ showLoginNote(); $('#loginEmail').focus(); }
})();
</script>
