<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 先方へ個別にお渡しするデモのため、検索エンジンには載せない -->
<meta name="robots" content="noindex, nofollow">
<title>Leaves Reply 体験デモ｜Hoshi Jungle</title>
<style>
  /* Hoshi Jungle 向けの体験デモ。お客さまに渡しているURLはこのファイル1つだけ（HANDOFF.md）。
     デザインと文言は leaves-reply の実際の管理画面・public/demo/index.html とそろえている。
     片方だけ直さないこと。

     配色は実アプリの Tailwind（brand / ink）にそろえる。
     小さい文字は背景との比 4.5:1 以上（tailwind.config.ts の実測値）。 */
  :root {
    color-scheme: light;
    --brand:#c8102e; --brand-600:#b00c26; --brand-700:#93091f;
    --brand-50:#fdf1f1; --brand-100:#fadbdc;
    --ink-900:#111111; --ink-700:#333333; --ink-600:#444444; --ink-500:#5a5a5a; --ink-400:#6f6f6f;
    --line:#e7e2e2; --soft:#f3f1f0; --bg:#f7f5f4;
    --blue:#4a6fb5;
    --up:#1d6b37; --up-bg:#e5f3e9;
    --gold:#b8860b;
    --crit:#b3261e; --crit-bg:#fdeeee; --crit-line:#efb1ad;
    --radius:18px;
    --shadow:0 1px 2px rgba(60,20,25,.04), 0 6px 18px -8px rgba(60,20,25,.12);
    --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; }
  body {
    font-family:var(--sans); color:var(--ink-900); background:var(--bg);
    -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.7;
  }
  button, input, textarea, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  svg { display:block; }

  /* ---- デモ帯（画面写真には写さない） ---- */
  .demobar {
    background:var(--ink-900); color:#f0f0f0; font-size:12px; padding:7px 16px;
    display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; text-align:center;
  }
  .demobar button {
    background:none; border:1px solid #555; color:#ddd; border-radius:999px;
    padding:1px 11px; font-size:11px;
  }
  .demobar button:hover { background:#2a2a2a; }

  /* ---- 骨組み ---- */
  .shell { display:flex; min-height:calc(100vh - 34px); }
  .side {
    width:294px; flex-shrink:0; color:#fff; display:flex; flex-direction:column;
    padding:30px 18px 22px;
    background:linear-gradient(180deg,#d4405a 0%,#c01933 45%,#ad0f2a 100%);
  }
  .logo { display:flex; align-items:baseline; gap:12px; padding:0 10px; }
  .logo .k { font-size:12px; font-weight:600; letter-spacing:.3em; opacity:.92; }
  .logo .v { font-size:23px; font-weight:800; letter-spacing:.01em; }
  .store {
    margin-top:28px; display:flex; gap:12px; align-items:center; padding:11px 12px;
    border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12); border-radius:14px;
  }
  .store .ic {
    width:44px; height:44px; border-radius:10px; background:#fff; color:var(--brand-600);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px;
  }
  .store .n { font-weight:700; font-size:15.5px; line-height:1.35; }
  .store .a { font-size:12.5px; opacity:.9; }
  .menu-k { margin:34px 12px 10px; font-size:12px; font-weight:700; letter-spacing:.22em; opacity:.9; }
  .nav { display:flex; flex-direction:column; gap:4px; }
  .nav button {
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:none; border:none; color:#fff; border-radius:12px; padding:12px 14px;
    font-size:16px; font-weight:500; white-space:nowrap;
  }
  .nav button:hover { background:rgba(255,255,255,.12); }
  .nav button[aria-current="page"] { background:#fff; color:var(--brand-600); font-weight:700; box-shadow:0 4px 14px -6px rgba(0,0,0,.35); }
  .nav svg { width:20px; height:20px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .nav .cnt {
    margin-left:auto; min-width:26px; height:26px; padding:0 7px; border-radius:999px;
    display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
    background:rgba(255,255,255,.22); color:#fff;
  }
  .nav .cnt.hot { background:#fff; color:var(--brand-600); }
  .nav button[aria-current="page"] .cnt { background:var(--brand-600); color:#fff; }
  .side-foot {
    margin-top:auto; border-top:1px solid rgba(255,255,255,.28); padding:18px 10px 0;
    display:flex; gap:12px; align-items:center;
  }
  .side-foot .ic {
    width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .side-foot .n { font-weight:700; font-size:15px; line-height:1.3; }
  .side-foot .s { font-size:13px; display:flex; align-items:center; gap:6px; }
  .side-foot .dot { width:8px; height:8px; border-radius:50%; background:#3ddc84; box-shadow:0 0 0 2px rgba(255,255,255,.35); }

  .main {
    flex:1; min-width:0; padding:30px 34px 60px;
    background:linear-gradient(180deg,#f6dfe3 0px,#f6e9eb 220px,var(--bg) 520px);
  }
  .inner { max-width:1100px; }

  /* ---- 上段 ---- */
  .top { display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .top .date { font-size:15px; color:var(--ink-500); }
  .top h1 { font-size:32px; font-weight:700; line-height:1.35; letter-spacing:.02em; margin-top:2px; }
  .top h1 span { display:inline-block; }
  .sync { margin-left:auto; display:flex; align-items:center; gap:14px; }
  .sync .last { font-size:14px; color:var(--ink-500); }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px;
    padding:10px 18px; font-size:15px; font-weight:600; border:1px solid transparent;
    transition:background .15s, box-shadow .15s;
  }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .btn-white { background:#fff; border-color:#ece6e6; color:var(--ink-700); box-shadow:0 2px 8px -4px rgba(0,0,0,.12); }
  .btn-white:not(:disabled):hover { background:var(--brand-50); }
  .btn-primary { background:var(--brand-600); color:#fff; }
  .btn-primary:not(:disabled):hover { background:var(--brand-700); }
  .btn-sub { background:#fff; border-color:#ddd6d6; color:var(--ink-700); }
  .btn-sub:not(:disabled):hover { background:var(--brand-50); }
  .btn-ghost { background:none; color:var(--ink-600); }
  .btn-ghost:not(:disabled):hover { background:var(--soft); }
  .spin { animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ---- 数字のカード ---- */
  .card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid #f0eaea; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .kpi { padding:22px 24px 20px; position:relative; min-height:150px; display:flex; flex-direction:column; }
  .kpi.hot { border:2px solid var(--brand-600); }
  .kpi .l { font-size:15px; color:var(--ink-600); }
  .kpi.hot .l { color:var(--ink-900); font-weight:700; }
  .kpi .v { margin-top:6px; font-size:46px; font-weight:800; line-height:1.15; letter-spacing:-.01em; }
  .kpi.hot .v { color:var(--brand-600); }
  .kpi .v small { font-size:15px; font-weight:500; color:var(--ink-500); margin-left:6px; }
  .kpi .sub { margin-top:auto; padding-top:8px; display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink-500); flex-wrap:wrap; }
  .up { display:inline-flex; align-items:center; gap:4px; background:var(--up-bg); color:var(--up); font-weight:700; font-size:13.5px; border-radius:999px; padding:2px 10px; }
  .pill-crit {
    display:inline-flex; align-items:center; gap:6px; background:var(--crit); color:#fff;
    font-size:14px; font-weight:700; border-radius:999px; padding:3px 12px 3px 8px;
  }
  .pill-crit i { width:17px; height:17px; border-radius:50%; background:#fff; color:var(--crit); font-style:normal; font-size:12px; font-weight:900; display:inline-flex; align-items:center; justify-content:center; }
  .kpi .go { margin-left:auto; background:none; border:none; color:var(--brand-600); font-weight:700; font-size:15px; display:inline-flex; gap:4px; align-items:center; }
  .kpi .go:hover { text-decoration:underline; }
  .spark { position:absolute; right:24px; top:56px; width:92px; height:40px; }

  /* ---- 週ごとのグラフ ---- */
  .chart { margin-top:24px; padding:22px 26px 20px; }
  .chart-h { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .chart-h h2 { font-size:18px; font-weight:700; }
  .chart-h .s { font-size:14px; color:var(--ink-500); }
  .legend { margin-left:auto; display:flex; gap:16px; font-size:14px; color:var(--ink-600); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:0; }
  .plot { position:relative; height:280px; margin:22px 0 0 34px; }
  .grid { position:absolute; inset:0 0 30px 0; }
  .grid .g { position:absolute; left:0; right:0; border-top:1px dashed #e6e0e0; }
  .grid .g.base { border-top:1px solid #cfc8c8; }
  .grid .g span { position:absolute; left:-34px; top:-10px; width:24px; text-align:right; font-size:13px; color:var(--ink-500); }
  .bars { position:absolute; inset:0 0 30px 0; display:flex; justify-content:space-around; align-items:flex-end; }
  .bar { width:7%; max-width:40px; display:flex; flex-direction:column; align-items:center; position:relative; height:100%; justify-content:flex-end; }
  .bar .t { font-size:14px; font-weight:700; margin-bottom:4px; }
  .bar .u { width:100%; background:var(--blue); border-radius:3px 3px 0 0; }
  .bar .r { width:100%; background:var(--brand-600); border-top:2px solid #fff; }
  .bar .x { position:absolute; bottom:-30px; font-size:13.5px; color:var(--ink-500); white-space:nowrap; }

  /* ---- 下段：一覧と詳細 ---- */
  .duo { margin-top:24px; display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:20px; align-items:start; }
  .list-h { padding:18px 20px 10px; display:flex; align-items:baseline; gap:12px; }
  .list-h h2 { font-size:17px; font-weight:700; }
  .list-h .s { font-size:13.5px; color:var(--ink-500); }
  .rows { list-style:none; padding:0 10px 10px; }
  .rows button {
    width:100%; text-align:left; background:none; border:none; border-radius:12px; padding:12px 10px;
    display:flex; gap:12px; align-items:flex-start;
  }
  .rows button:hover { background:var(--soft); }
  .rows button[aria-current="true"] { background:var(--brand-50); box-shadow:inset 3px 0 0 var(--brand-600); }
  .rows .meta { min-width:0; flex:1; }
  .rows .line1 { display:flex; gap:8px; align-items:center; }
  .rows .nm { font-weight:700; font-size:14.5px; }
  .rows .ago { margin-left:auto; font-size:12.5px; color:var(--ink-400); white-space:nowrap; }
  .rows .ex { font-size:13.5px; color:var(--ink-600); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rows .line3 { display:flex; gap:8px; align-items:center; margin-top:4px; }
  .chip { display:inline-flex; align-items:center; border-radius:999px; padding:1px 9px; font-size:12px; font-weight:600; }
  .chip.crit { background:var(--crit-bg); color:var(--crit); }
  .chip.wait { background:var(--soft); color:var(--ink-700); }
  .chip.done { background:var(--up-bg); color:var(--up); }
  .chip.skip { background:var(--soft); color:var(--ink-400); }

  /* ---- クチコミのカード ---- */
  .rv { padding:24px 26px 24px; }
  .rv-head { display:flex; gap:16px; align-items:center; }
  .av {
    width:52px; height:52px; border-radius:50%; flex-shrink:0; background:var(--soft); border:1px solid #e3dede;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; color:var(--ink-700);
  }
  .rows .av { width:38px; height:38px; font-size:14px; }
  .rv-head .nm { font-size:21px; font-weight:700; line-height:1.3; }
  .rv-head .sub { display:flex; gap:12px; align-items:center; font-size:15px; color:var(--ink-500); flex-wrap:wrap; }
  .stars { letter-spacing:2px; font-size:16px; color:var(--gold); }
  .stars.low { color:var(--crit); }
  .stars .off { color:#d9d4d4; }
  .rv-head .ago { margin-left:auto; align-self:flex-start; font-size:15px; color:var(--ink-500); white-space:nowrap; }
  .rv-text { margin-top:16px; font-size:18px; line-height:1.85; white-space:pre-wrap; }
  .trans { margin-top:16px; background:var(--soft); border-radius:14px; padding:14px 18px; }
  .trans .k { font-size:13.5px; font-weight:700; color:var(--ink-500); }
  .trans p { margin-top:4px; font-size:15.5px; line-height:1.85; color:var(--ink-600); }
  .alert {
    margin-top:16px; display:flex; gap:14px; padding:15px 18px 15px 18px;
    background:var(--crit-bg); border:1px solid var(--crit-line); border-left:6px solid var(--crit); border-radius:14px;
  }
  .alert svg { width:22px; height:22px; flex-shrink:0; margin-top:3px; fill:none; stroke:var(--crit); stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .alert b { display:block; color:var(--crit); font-size:16px; }
  .alert p { font-size:15px; line-height:1.85; color:var(--ink-700); }
  .reply { margin-top:20px; }
  .reply-h { display:flex; align-items:center; gap:10px; }
  .reply-h b { font-size:15.5px; }
  .ai { background:var(--brand-50); color:var(--brand-600); font-weight:800; font-size:12px; border-radius:999px; padding:1px 9px; letter-spacing:.04em; }
  .reply-h .count { margin-left:auto; font-size:14px; color:var(--ink-500); font-variant-numeric:tabular-nums; }
  .seg-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .seg { display:inline-flex; background:var(--soft); border-radius:12px; padding:4px; gap:2px; }
  .seg button { background:none; border:none; border-radius:9px; padding:7px 22px; font-size:15.5px; color:var(--ink-600); }
  .seg button:hover { color:var(--ink-900); }
  .seg button[aria-pressed="true"] { background:#fff; color:var(--ink-900); font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .seg-row .hint { font-size:13px; color:var(--ink-400); }
  textarea {
    display:block; width:100%; margin-top:14px; min-height:96px; resize:vertical; overflow:hidden;
    border:1px solid #ddd6d6; border-radius:14px; padding:14px 18px; background:#fff;
    font-size:16px; line-height:1.9; outline:none;
  }
  textarea:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-100); }
  textarea[readonly] { background:var(--soft); color:var(--ink-700); }
  .acts { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .acts .right { margin-left:auto; }
  .note { margin-top:12px; font-size:14px; color:var(--up); font-weight:600; }
  .note.muted { color:var(--ink-500); font-weight:500; }

  /* ---- ほかの画面 ---- */
  .page-h h1 { font-size:28px; font-weight:700; }
  .page-h p { margin-top:6px; font-size:15px; color:var(--ink-600); max-width:720px; }
  .page-h { margin-bottom:20px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button, .filters button {
    background:#fff; border:1px solid #e4dede; border-radius:999px; padding:6px 16px; font-size:14px; color:var(--ink-700);
  }
  .tabs button[aria-pressed="true"], .filters button[aria-pressed="true"] { background:var(--brand-600); border-color:var(--brand-600); color:#fff; font-weight:700; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
  .filters button { padding:4px 13px; font-size:13px; }
  .stack { display:flex; flex-direction:column; gap:18px; max-width:860px; }
  .empty { padding:48px 20px; text-align:center; color:var(--ink-500); }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .tile { padding:18px 20px; }
  .tile .l { font-size:14px; color:var(--ink-600); }
  .tile .v { font-size:34px; font-weight:800; margin-top:4px; }
  .tile .v small { font-size:14px; font-weight:500; color:var(--ink-500); margin-left:4px; }
  .box { padding:22px 24px; }
  .box h2 { font-size:17px; font-weight:700; }
  .box ul { margin:10px 0 0 1.2em; font-size:15px; color:var(--ink-700); }
  .box li { margin-bottom:4px; }
  .fine { font-size:13px; color:var(--ink-500); margin-top:12px; }
  .form { display:grid; gap:20px; max-width:720px; }
  .form label.k { display:block; font-size:14px; font-weight:700; color:var(--ink-700); margin-bottom:8px; }
  .form input[type=text] { width:100%; border:1px solid #ddd6d6; border-radius:12px; padding:11px 14px; background:#fff; outline:none; }
  .form input[type=text]:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-100); }
  .form textarea { margin-top:0; font-size:15px; min-height:80px; }
  .radios { display:flex; gap:8px; flex-wrap:wrap; }
  .radios label { display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid #e4dede; border-radius:12px; padding:9px 14px; cursor:pointer; font-size:15px; }
  .radios label:has(input:checked) { border-color:var(--brand-600); box-shadow:inset 0 0 0 1px var(--brand-600); background:var(--brand-50); }
  .radios input { accent-color:var(--brand-600); }

  /* ---- トースト ---- */
  .toast {
    position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) translateY(14px); background:var(--ink-900); color:#fff;
    padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; z-index:60; max-width:calc(100vw - 40px); text-align:center;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- 狭い画面：左の帯を上の帯に変える ---- */
  /* 中の長い1行（クチコミの抜粋）で列が広がり、横にはみ出すのを防ぐ */
  .duo > * { min-width:0; }
  @media (max-width:1100px) {
    .duo { grid-template-columns:minmax(0,1fr); }
  }
  @media (max-width:860px) {
    .shell { flex-direction:column; }
    .side { width:auto; padding:16px 0 18px; }
    .logo { padding:0 22px; gap:10px; }
    .logo .k { font-size:11px; }
    .logo .v { font-size:22px; }
    .store, .menu-k, .side-foot { display:none; }
    .nav { flex-direction:row; gap:8px; overflow-x:auto; padding:14px 22px 0; scrollbar-width:none; }
    .nav::-webkit-scrollbar { display:none; }
    .nav button { width:auto; padding:9px 14px; gap:10px; font-size:15px; }
    .nav .cnt { margin-left:2px; }
    .main { padding:22px 18px 60px; background:linear-gradient(180deg,#f6e3e6 0px,var(--bg) 360px); }
    .top { display:block; margin-bottom:20px; }
    .top h1 { font-size:26px; }
    .sync { margin:12px 0 0; }
    .kpis { gap:12px; }
    .kpi { padding:16px 16px 14px; min-height:0; border-radius:16px; }
    .kpi .v { font-size:36px; }
    .kpi .l { font-size:14px; }
    .kpi .sub { font-size:13px; gap:8px; }
    .kpi .go { margin-left:auto; }
    .spark { display:none; }
    .chart { padding:18px 16px 16px; }
    .legend { margin-left:0; width:100%; justify-content:flex-end; }
    .plot { height:220px; margin-left:26px; }
    .grid .g span { left:-28px; font-size:11px; }
    .bar .x { font-size:10px; transform:rotate(-35deg); transform-origin:top center; bottom:-34px; }
    .bar .t { font-size:12px; }
    .rv { padding:18px 16px; }
    .rv-head .nm { font-size:18px; }
    .rv-text { font-size:16px; }
    .seg button { padding:6px 16px; }
    .tiles { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  /* JavaScript が動かない環境（LINE などのファイルプレビュー）向けの案内 */
  .nojs { max-width:460px; margin:48px auto; padding:0 20px; }
  .nojs .card { padding:26px 24px; }
  .nojs h2 { font-size:19px; color:var(--brand-700); margin-bottom:10px; }
  .nojs p, .nojs ol { font-size:14px; margin-bottom:12px; }
  .nojs ol { margin-left:20px; }

  document.addEventListener("click", function (e) {

    // 言語切替（ログイン前でも効く。共用端末で読めない画面を出さないため）
    if (el.dataset.setlang) { S.lang = el.dataset.setlang; render(); return; }
    if (el.id === "resetBtn") { S = fresh(S.lang); render(); window.scrollTo(0, 0); toast(d().resetDone); return; }
    if (el.id === "loginViewBtn" || el.id === "logoutBtn") { S.signedIn = false; S.loginError = false; render(); return; }
    if (el.id === "fillBtn") { document.getElementById("pc").value = DEMO_PASSCODE; return; }
    if (el.id === "enterBtn") {
      var v = (document.getElementById("pc").value || "").trim().toUpperCase().replace(/\s+/g, "");
      S.signedIn = v === DEMO_PASSCODE; S.loginError = !S.signedIn; render(); return;
    }
    if (el.dataset.view) { S.view = el.dataset.view; if (S.view === "reviews") { S.tab = "open"; S.filter = "all"; } render(); window.scrollTo(0, 0); return; }
    if (el.dataset.tab) { S.tab = el.dataset.tab; render(); return; }
    if (el.dataset.filter) { S.filter = el.dataset.filter; render(); return; }
    if (el.dataset.pick) { S.pick = el.dataset.pick; render(); return; }

    if (el.id === "syncBtn") {
      if (S.busy) return;
      S.busy = "sync"; render();
      setTimeout(function () { S.busy = null; S.lastSync = new Date(); render(); toast(d().syncDone); }, 900);
      return;
    }
    if (el.dataset.style) {
      var rs = byId(el.dataset.id), next = rs.options[el.dataset.style];
      if (!next || next === rs.body) return;
      // 手で直した文章を黙って捨てない（実アプリと同じ）
      if (rs.selected === null && !window.confirm(t.switchConfirm)) return;
      rs.body = next; rs.selected = el.dataset.style; rs.dirty = false; render();
      return;
    }

    var act = el.dataset.do;
    if (!act || S.busy) return;
    var r = byId(el.dataset.id);
    if (act === "publish") {
      if (!r.body.trim()) { toast(t.emptyReply); return; }
      S.busy = "pub:" + r.id; render();
      setTimeout(function () {
        r.status = "published"; r.selected = null; S.replied[7]++;
        S.busy = null; render(); toast(d().publishedNote);

      S.busy = "gen:" + r.id; render();
      setTimeout(function () {
        r.selected = "standard"; r.body = r.options.standard; r.dirty = false;
        S.busy = null; render(); toast(d().regenNote);
      }, 800);
      return;
    }
    if (act === "skip") { r.status = "skipped"; r.selected = null; render(); toast(t.skippedNote); }
  });

  // 本文を直したら「編集済み」にし、保存するまで公開できないようにする（実アプリと同じ）
  document.addEventListener("input", function (e) {
    var ta = e.target.closest ? e.target.closest("textarea[data-id]") : null;
    if (!ta) return;
    var r = byId(ta.dataset.id);
    if (!r || !r.options) return;
    r.body = ta.value; r.selected = null; r.dirty = true;
    ["warm", "standard", "concise"].forEach(function (k) { if (r.options[k] === ta.value) r.selected = k; });
    var card = ta.closest("[data-card]");
    var c = card.querySelector("[data-count]"); if (c) c.textContent = ta.value.length + " / " + MAX;
    var hint = card.querySelector(".seg-row .hint"); if (hint) hint.textContent = r.selected ? d().hints[r.selected] : d().edited;
    Array.prototype.forEach.call(card.querySelectorAll("[data-style]"), function (b) {
      b.setAttribute("aria-pressed", String(r.selected === b.dataset.style));
    });
    var pub = card.querySelector('[data-do="publish"]'), save = card.querySelector('[data-do="save"]');
    if (pub) { pub.disabled = true; pub.title = d().saveFirst; }
    if (save) save.disabled = false;
    ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px";
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var pc = document.getElementById("pc");
    if (pc && document.activeElement === pc) { e.preventDefault(); document.getElementById("enterBtn").click(); }
  });
  window.addEventListener("resize", autosize);

  S = fresh();
  render();
})();
</script>
</body>
</html>
