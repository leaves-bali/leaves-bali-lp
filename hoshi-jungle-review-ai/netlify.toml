# =============================================================================
# Netlify 設定（無料プランでの本番ホスティング）
# -----------------------------------------------------------------------------
# なぜ Netlify Free か:
#   - Vercel Hobby は「非商用の個人利用限定」でホテルの業務ツールには使えない。
#     Netlify の Free プランは商用プロジェクトのデプロイを明示的に許可している。
#   - Cloudflare Workers Free は CPU 10ms 制限があり、パスコード認証の
#     scrypt（実測 93ms）が動かない。Netlify は実 Node.js なので問題ない。
#
# 制約と対処:
#   - 関数タイムアウトが 10 秒。AI 生成のバッチは収まらないため、
#     定期同期は GitHub Actions に逃がしている（.github/workflows/sync-reviews.yml）。
#     画面から呼ぶ API はすべて 7 秒の時間予算で打ち切る設計にしてある。
# =============================================================================

[build]
  base    = "hoshi-jungle-review-ai"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Next.js のサーバー機能（App Router / API Routes）を有効にする公式ランタイム。
# Netlify が自動検出して導入するが、明示しておくと挙動が安定する。
[[plugins]]
  package = "@netlify/plugin-nextjs"
